        (function () {
            const RecoloredGridLayer = L.GridLayer.extend({
                createTile: function (coords, done) {
                    const tile = document.createElement('canvas');
                    tile.width = 256;
                    tile.height = 256;
                    const context = tile.getContext('2d', {willReadFrequently: true});
                    const image = new Image();
                    image.crossOrigin = 'anonymous';

                    image.onload = function () {
                        try {
                            context.drawImage(image, 0, 0, 256, 256);
                            const imageData = context.getImageData(0, 0, 256, 256);
                            const pixels = imageData.data;

                            for (let index = 0; index < pixels.length; index += 4) {
                                const red = pixels[index];
                                const green = pixels[index + 1];
                                const blue = pixels[index + 2];
                                const alpha = pixels[index + 3];

                                if (alpha < 20) {
                                    continue;
                                }

                                // 特別警戒区域：元タイルの赤系を変換
                                const isSpecial =
                                    red >= 150 &&
                                    red > green * 1.45 &&
                                    red > blue * 1.45;

                                // 警戒区域：元タイルの黄色系を変換
                                const isWarning =
                                    red >= 180 &&
                                    green >= 150 &&
                                    blue <= 120 &&
                                    Math.abs(red - green) <= 115;

                                if (isSpecial) {
                                    pixels[index] = 123;
                                    pixels[index + 1] = 31;
                                    pixels[index + 2] = 162;
                                } else if (isWarning) {
                                    pixels[index] = 179;
                                    pixels[index + 1] = 136;
                                    pixels[index + 2] = 255;
                                }
                            }

                            context.putImageData(imageData, 0, 0);
                            done(null, tile);
                        } catch (error) {
                            done(error, tile);
                        }
                    };

                    image.onerror = function () {
                        done(new Error('ハザードタイルを読み込めませんでした。'), tile);
                    };

                    image.src = 'https://disaportal.gsi.go.jp/data/raster/05_dosekiryukeikaikuiki/{z}/{x}/{y}.png'
                        .replace('{z}', coords.z)
                        .replace('{x}', coords.x)
                        .replace('{y}', coords.y);

                    return tile;
                }
            });

            map_c58942312f7fb5c011774e198c3f0a06.fitBounds(
                [[33.68086418, 130.66959852], [33.73404436, 130.72922669]],
                {"padding": [8, 8]}
            );
        
    
            const strictBounds = L.latLngBounds(
                L.latLng(33.68086418, 130.66959852),
                L.latLng(33.73404436, 130.72922669)
            );

            const strictMap = map_c58942312f7fb5c011774e198c3f0a06;

            // 小竹町全体が収まる最大のズームアウト値を計算
            strictMap.fitBounds(strictBounds, {padding: [8, 8], animate: false});
            const strictFitZoom = strictMap.getZoom();
            const strictMinZoom = Math.max(
                0,
                strictFitZoom - 2
            );

            strictMap.setMinZoom(strictMinZoom);

            // 縮小時に画面が境界より大きくなるため、移動可能範囲は
            // 小竹町中心から東西南北へ広げて設定する
            const center = strictBounds.getCenter();
            const latSpan = strictBounds.getNorth() - strictBounds.getSouth();
            const lngSpan = strictBounds.getEast() - strictBounds.getWest();
            const expansion = Math.pow(2, 2);
            const allowedBounds = L.latLngBounds(
                L.latLng(
                    center.lat - (latSpan * expansion / 2),
                    center.lng - (lngSpan * expansion / 2)
                ),
                L.latLng(
                    center.lat + (latSpan * expansion / 2),
                    center.lng + (lngSpan * expansion / 2)
                )
            );

            strictMap.setMaxBounds(allowedBounds);
            strictMap.options.maxBoundsViscosity = 1.0;

            // ウィンドウサイズ変更後も制限を再計算
            window.addEventListener('resize', function () {
                strictMap.invalidateSize(false);
                const newFitZoom = strictMap.getBoundsZoom(
                    strictBounds,
                    false,
                    [8, 8]
                );
                const newMinZoom = Math.max(
                    0,
                    newFitZoom - 2

          const layers=[
            {label:'洪水',type:'flood',url:'https://disaportal.gsi.go.jp/data/raster/01_flood_l2_shinsuishin_data/{z}/{x}/{y}.png'},
            {label:'土石流',type:'soil',url:'https://disaportal.gsi.go.jp/data/raster/05_dosekiryukeikaikuiki/{z}/{x}/{y}.png'},
            {label:'急傾斜地',type:'soil',url:'https://disaportal.gsi.go.jp/data/raster/05_kyukeishakeikaikuiki/{z}/{x}/{y}.png'},
            {label:'地すべり',type:'soil',url:'https://disaportal.gsi.go.jp/data/raster/05_jisuberikeikaikuiki/{z}/{x}/{y}.png'}
          ];

          function pointInRing(lng,lat,ring){
            let inside=false;
            for(let i=0,j=ring.length-1;i<ring.length;j=i++){
              const xi=ring[i][0], yi=ring[i][1];
              const xj=ring[j][0], yj=ring[j][1];
              const intersects=((yi>lat)!=(yj>lat)) &&
                (lng < (xj-xi)*(lat-yi)/((yj-yi)||1e-15)+xi);
              if(intersects)inside=!inside;
            }
            return inside;
          }

          function pointInPolygon(lng,lat,polygon){
            if(!polygon || polygon.length===0)return false;
            if(!pointInRing(lng,lat,polygon[0]))return false;
            for(let i=1;i<polygon.length;i++){
              if(pointInRing(lng,lat,polygon[i]))return false;
            }
            return true;
          }

          function pointInGeometry(lng,lat,geometry){
            if(!geometry)return false;
            if(geometry.type==='Polygon')return pointInPolygon(lng,lat,geometry.coordinates);
            if(geometry.type==='MultiPolygon')return geometry.coordinates.some(p=>pointInPolygon(lng,lat,p));
            return false;
          }

          function isInsideKotake(latlng){
            return (kotakeBoundary.features||[]).some(feature=>
              pointInGeometry(latlng.lng,latlng.lat,feature.geometry)
            );
          }

          function hidePointInfo(){
            clearTimeout(timer);
            sequence++;
            point.style.display='none';
            panel.style.display='none';
          }

          function tilePoint(lat,lng,z){
            const n=Math.pow(2,z);
            const x=(lng+180)/360*n;
            const rad=lat*Math.PI/180;
            const y=(1-Math.asinh(Math.tan(rad))/Math.PI)/2*n;
            return {tx:Math.floor(x),ty:Math.floor(y),px:Math.floor((x-Math.floor(x))*256),py:Math.floor((y-Math.floor(y))*256)};
          }

          function loadPixel(urlTemplate,lat,lng){
            const p=tilePoint(lat,lng,sampleZoom);
            const url=urlTemplate.replace('{z}',sampleZoom).replace('{x}',p.tx).replace('{y}',p.ty);
            return new Promise(resolve=>{
              const img=new Image();
              img.crossOrigin='anonymous';
              img.onload=function(){
                try{
                  const canvas=document.createElement('canvas');
                  canvas.width=256; canvas.height=256;
                  const ctx=canvas.getContext('2d',{willReadFrequently:true});
                  ctx.drawImage(img,0,0);
                  const d=ctx.getImageData(p.px,p.py,1,1).data;
                  resolve({r:d[0],g:d[1],b:d[2],a:d[3]});
                }catch(error){resolve(null)}
              };
              img.onerror=()=>resolve(null);
              img.src=url;
            });
          }

          function distance(c,p){
            return Math.sqrt((c.r-p[0])**2+(c.g-p[1])**2+(c.b-p[2])**2);
          }

          function floodText(c){
            if(!c||c.a<25)return '―';
            const palette=[
              [[255,255,178],'0.5m未満'],
              [[255,211,127],'0.5m～3m'],
              [[255,127,127],'3m～5m'],
              [[231,127,203],'5m～10m'],
              [[178,102,178],'10m以上']
            ];
            let best=palette[0],score=999;
            palette.forEach(item=>{
              const value=distance(c,item[0]);
              if(value<score){score=value;best=item}
            });
            return score<95 ? best[1] : '浸水想定区域（区分判定不能）';
          }

          function soilText(c){
            if(!c||c.a<25)return '―';
            const red=distance(c,[230,0,18]);
            const yellow=Math.min(distance(c,[255,240,0]),distance(c,[255,255,0]));
            if(red<110&&red<yellow)return '特別警戒区域';
            if(yellow<125)return '警戒区域';
            return '着色区域（区分判定不能）';
          }

          function row(label,value){
            const risk=value !== '―';
            return '<div class="hh-row"><span class="hh-label">'+label+'</span><span class="'+
              (risk?'hh-risk':'hh-none')+'">'+value+'</span></div>';
          }

          async function inspect(latlng, mousePosition){
            const current=++sequence;

            // 前回判定地点からほとんど動いていない場合は再描画しない
            if(lastInspectedLatLng && map.distance(lastInspectedLatLng, latlng) < minimumMoveMeters){
              return;
            }

            const pixels=await Promise.all(layers.map(layer=>loadPixel(layer.url,latlng.lat,latlng.lng)));
            if(current!==sequence)return;

            let html='<div class="hh-coord">緯度 '+latlng.lat.toFixed(6)+
              '　経度 '+latlng.lng.toFixed(6)+'</div>';
            html+=row('洪水',floodText(pixels[0]));
            html+=row('土石流',soilText(pixels[1]));
            html+=row('急傾斜地',soilText(pixels[2]));
            html+=row('地すべり',soilText(pixels[3]));
            panelBody.innerHTML=html;
            lastInspectedLatLng=L.latLng(latlng.lat,latlng.lng);

            // 情報取得後に一度だけ位置を決めて表示する
            positionPanel(mousePosition);
            panel.style.display='block';
          }

          function positionPanel(mousePosition){
            const margin=12;
            const gap=18;
            const panelWidth=panel.offsetWidth || 205;
            const panelHeight=panel.offsetHeight || 190;
            let left=mousePosition.clientX + gap;
            let top=mousePosition.clientY + gap;

            if(left + panelWidth + margin > window.innerWidth){
              left=mousePosition.clientX - panelWidth - gap;
            }
            if(top + panelHeight + margin > window.innerHeight){
              top=mousePosition.clientY - panelHeight - gap;
            }
            panel.style.left=Math.max(margin,left)+'px';
            panel.style.top=Math.max(margin,top)+'px';
          }

          map.on('mousemove',function(event){
            if(!pointInfoEnabled || !isInsideKotake(event.latlng)){
              hidePointInfo();
              lastInspectedLatLng=null;
              return;
            }

            lastLatLng=L.latLng(event.latlng.lat,event.latlng.lng);
            pendingMousePosition={
              clientX:event.originalEvent.clientX,
              clientY:event.originalEvent.clientY
            };

            const containerPoint=map.latLngToContainerPoint(event.latlng);
            point.style.display='block';
            point.style.left=containerPoint.x+'px';
            point.style.top=containerPoint.y+'px';

            // マウス移動中は既存パネルを消さず、位置も動かさない
            // 停止後に最新地点だけを判定し、結果取得後に一度だけ更新する
            clearTimeout(timer);
            timer=setTimeout(function(){
              inspect(lastLatLng,pendingMousePosition);
            },hoverDelay);
          });

          map.on('mouseout',hidePointInfo);

          map.on('dragstart zoomstart',hidePointInfo);

          const PointInfoControl=L.Control.extend({
            options:{position:'topright'},
            onAdd:function(){
              const container=L.DomUtil.create('div','point-info-toggle');
              container.innerHTML='<label><input type="checkbox" checked>ポイント情報有効</label>';
              const checkbox=container.querySelector('input');
              L.DomEvent.disableClickPropagation(container);
              L.DomEvent.disableScrollPropagation(container);
              checkbox.addEventListener('change',function(){
                pointInfoEnabled=checkbox.checked;
                if(!pointInfoEnabled){
                  hidePointInfo();
                  lastInspectedLatLng=null;
                }
              });
              return container;
            }
          });
          map.addControl(new PointInfoControl());
        })();
